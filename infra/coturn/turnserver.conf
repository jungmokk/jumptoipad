# Jump Desktop Clone — Coturn Configuration
#
# 이 설정은 중국 환경에서 GFW DPI를 우회하도록 최적화되어 있습니다.
# TURNS (TURN over TLS) on TCP 443을 사용합니다.

# ─── 기본 설정 ───
listening-port=443
tls-listening-port=443

# ─── 네트워크 인터페이스 ───
# 서버의 공인 IP 주소로 교체하세요
# external-ip=YOUR_PUBLIC_IP
listening-ip=0.0.0.0
relay-ip=0.0.0.0

# ─── TLS 인증서 ───
cert=/etc/coturn/certs/cert.pem
pkey=/etc/coturn/certs/privkey.pem

# ─── 인증 ───
# 장기 인증(long-term credential) 사용
lt-cred-mech
realm=turn.yourdomain.hk
# 사용자 추가: user=username:password
# 또는 환경변수에서 설정
user=jumpdesktop:changeme

# ─── 보안 설정 ───
# Fingerprint 사용 (RFC 5389)
fingerprint

# Stale nonce 방지
stale-nonce=600

# 최대 릴레이 포트 범위 (최소화하여 보안 강화)
min-port=49152
max-port=49252

# 로컬 네트워크 접근 차단 (릴레이가 내부 네트워크에 접근 방지)
no-multicast-peers

# ─── 성능 최적화 ───
# 릴레이 스레드 수
relay-threads=4

# ─── 로깅 ───
log-file=stdout
verbose

# ─── 중국 GFW 대응 핵심 설정 ───
# TCP만 허용 (UDP 3478은 DPI에 의해 차단될 수 있음)
no-udp
no-dtls

# TURNS (TLS) 필수 사용
no-tcp-relay
